name: Staging Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Upload"]
    types:
      - completed
    branches:
      - staging

concurrency:
  group: deploy-frontend-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: "staging"
      url: "https://staging.agent-forge.hng14.com"

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        name: agentforge-build
        path: .

    - name: Decode and create .env file
      run: |
        echo "${{ secrets.STAGING_ENV_BASE64 }}" | base64 -d > .env

    - name: Copy to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: ".env,agentforge-build.tar.gz"
        target: "~/agentforge/frontend/staging"

    - name: Delete local artifacts
      run: rm -f agentforge-build.tar.gz .env

    - name: Deploy on server
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script_stop: true
        script: |
          set -e

          echo "=== Deploying Frontend Staging ==="
          cd ~/agentforge/frontend/staging

          # Extract build artifacts
          tar -xzf agentforge-build.tar.gz
          rm -f agentforge-build.tar.gz

          # Install production dependencies
          pnpm install --prod

          # Snapshot PM2 state for rollback
          pm2 save || true

          # Restart application
          echo "=== Starting PM2 Process ==="
          if pm2 describe frontend-staging > /dev/null 2>&1; then
            pm2 restart frontend-staging --update-env
          else
            pm2 start "pnpm start" --name frontend-staging
          fi

          # Health check with retry
          echo "=== Running Health Check ==="
          MAX_RETRIES=15
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sf "http://localhost:3000/" > /dev/null 2>&1; then
              echo "✅ Health check passed after $((RETRY_COUNT + 1)) attempt(s)"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Health check attempt ${RETRY_COUNT}/${MAX_RETRIES} failed, retrying in 2s..."
            sleep 2
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Health check failed. Rolling back..."
            pm2 resurrect || pm2 start "pnpm start" --name frontend-staging
            echo "❌ Deployment FAILED - health check did not pass."
            exit 1
          fi

          echo "=== Frontend Staging Deployment Complete ==="
